<!DOCTYPE html>
<html>
    <head>
        <title>Moyotech Interview Round 3</title>
    </head>
    <body>
        <form method = "post">
            <label for ="first name"> First Name</label>
            <input type = "text" name = "first name" id = "first name" required>

            <br>

            <label for ="last name"> Last Name</label>
            <input type = "text" name = "last name" id = "last name" required>

            <br>
            <label for = "birthday"> Birthday </label>
            <input type = "date" name = "birthday" id = "birthday" required>

            <br>

            <p>Home Currency:</p>
            <select name = "home currency" id = "home currency" required>
                <option value = "USD"> USD </option>
                <option value = "EUR"> EUR </option>
                <option value = "GBP"> GBP </option>
                <option value = "RWF"> RWF </option>
            </select>

            <br>
            <br>
            <button type = "submit" id = "save-button"> Save </button> 
            <button type = "reset"> Reset </button>
        </form>

        <script>
            //add action to validate the form data according to regex rules

            let baseCurrency = document.getElementById("home currency").value;
            baseCurrency.addEventListener("change", function() {
                baseCurrency = this.value;
                async function fetchExchangeRates(baseCurrency) {
                    try {
                        let response = await fetch(`https://api.frankfurter.dev/v1/latest?base={baseCurrency}`);
                        let data = await response.json();
                        alert(`Exchange rates for ${baseCurrency}: ${JSON.stringify(data.rates)}`);

                    }
                    catch (error) {
                        console.error("Error fetching exchange rates:", error);
                    }
                }
            })
        </script>
    </body>
</html>
