<!DOCTYPE html>
<html>
    <head>
        <title>Moyotech Interview Round 3</title>
    </head>
    <body>
        <form method = "post">
            <label for ="first name"> First Name</label>
            <input type = "text" name = "first name" id = "first name" required>

            <br>

            <label for ="last name"> Last Name</label>
            <input type = "text" name = "last name" id = "last name" required>

            <br>
            <label for = "birthday"> Birthday </label>
            <input type = "date" name = "birthday" id = "birthday" required>

            <br>

             <label for="home-currency">Home Currency</label>

            <select
                name="currency_code"
                id="home-currency"
                required
            >
                <option value="">-- Select Currency --</option>
                <option value="USD">USD</option>
                <option value="EUR">EUR</option>
                <option value="GBP">GBP</option>
                <option value="RWF">RWF</option>
            </select>

            <br>
            <br>
            <button type = "submit" id = "save-button"> Save </button> 
            <button type = "reset"> Reset </button>
        </form>

        <div id="rates">
        <h2>Exchange Rates</h2>
        <div id="rates-list">
            Select a currency to see exchange rates.
        </div>
    </div>

        <script>
            //add action to validate the form data according to regex rules
        const currencySelect = document.getElementById("home-currency");
        const ratesList = document.getElementById("rates-list");
        const errorMessage = document.getElementById("error");
        const successMessage = document.getElementById("success");


        currencySelect.addEventListener("change", async function () {
            const baseCurrency = this.value;

            if (!baseCurrency) {
                ratesList.textContent =
                    "Select a currency to see exchange rates.";
                return;
            }

            await fetchExchangeRates(baseCurrency);
        });


 
        async function fetchExchangeRates(baseCurrency) {
            try {
                errorMessage.textContent = "";
                ratesList.textContent = "Loading exchange rates...";

                const response = await fetch(
                    `https://api.frankfurter.dev/v1/latest?base=${baseCurrency}`
                );

        
                if (!response.ok) {
                    throw new Error(
                        `HTTP ${response.status}: ${response.statusText}`
                    );
                }

                const data = await response.json();

                const rates = Object.entries(data.rates).slice(0, 4);

                ratesList.innerHTML = "";

                rates.forEach(([currency, rate]) => {
                    const paragraph = document.createElement("p");

                    paragraph.textContent =
                        `1 ${baseCurrency} = ${rate} ${currency}`;

                    ratesList.appendChild(paragraph);
                });

            } catch (error) {
                ratesList.textContent = "Unable to load exchange rates.";
                errorMessage.textContent = error.message;

                console.error(
                    "Error fetching exchange rates:",
                    error
                );
            }
        }
        </script>
    </body>
</html>
